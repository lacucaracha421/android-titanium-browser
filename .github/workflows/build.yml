name: Build

on:
  push:
    branches:
      - proton-auth-fix
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Create ephemeral test signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore test.jks \
            -storepass titaniumtest \
            -keypass titaniumtest \
            -alias titanium-test \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Titanium Proton Test,O=Laku,C=KR"
          printf 'keyAlias=titanium-test\nkeyPassword=titaniumtest\nstorePassword=titaniumtest\n' > local.properties
          echo "LOCAL_TEST_JKS=$(base64 -w0 local.properties)" >> "$GITHUB_ENV"
          echo "STORE_TEST_JKS=$(base64 -w0 test.jks)" >> "$GITHUB_ENV"

      - name: Build ARM64 test APK
        env:
          DEBIAN_FRONTEND: noninteractive
          TITANIUM_ARM64_ONLY: '1'
        run: |
          chmod +x *.sh
          ./build.sh

      - name: Set version
        run: |
          echo "VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)" >> "$GITHUB_ENV"

      - name: Publish test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proton-auth-test-${{ github.run_number }}
          name: Titanium Proton auth test ${{ env.VERSION }}
          prerelease: true
          generate_release_notes: false
          body: |
            Test build with Chromium's upstream desktop-Android webRequest.onAuthRequired fix backported.
            Test-signed; package id: io.github.lacucaracha421.titaniumproton
          files: chromium/src/out/release/*-arm64-v8a.apk